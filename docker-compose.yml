
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: transactions_db
    ports:
      - "5433:5432"  # 5432 is often taken by a local Postgres; scripts use DB_PORT=5433
    volumes:
      - ./db-init-script.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    depends_on:
      - kafka
      - postgres
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_USER: fintech
      DB_PASSWORD: fintech
      DB_NAME: transactions_db
      DISABLE_KAFKA_CONSUMER: "1"  # the consumer runs in its own service below
    volumes:
      - ./static:/app/static

  # Same image as the API, but runs only the Kafka -> Postgres consumer, so it
  # can be killed and restarted on its own (scripts/kill_test.py).
  consumer:
    build: .
    command: ["python", "-m", "app.consumer"]
    depends_on:
      - kafka
      - postgres
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      DB_USER: fintech
      DB_PASSWORD: fintech
      DB_NAME: transactions_db
