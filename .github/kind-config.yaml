# The throwaway one-node kind cluster for the k8s-smoke CI job.
# The NodePorts are mapped to the GitHub runner, so the test script there can
# reach the API at localhost:8080 and Postgres at localhost:5432.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fintech
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8080, protocol: TCP}  # API (k8s/api.yaml)
      - {containerPort: 30432, hostPort: 5432, protocol: TCP}  # Postgres (k8s/postgres.yaml)
