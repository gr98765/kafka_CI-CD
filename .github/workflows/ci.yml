name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Real Postgres for the duplicate / velocity tests (tests/test_reliability.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintech
          POSTGRES_PASSWORD: fintech
          POSTGRES_DB: transactions_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          pip install ruff==0.17.4
          ruff check .

      - name: Validate Kubernetes manifests (no cluster needed)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary k8s/

      - name: Run tests
        env:
          DISABLE_KAFKA_CONSUMER: 1
          TEST_DB_HOST: localhost
          REQUIRE_DB_TESTS: 1  # fail, don't skip, if the DB tests can't run
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t kafka-cicd-app .

  # The pipeline on a throwaway one-node kind cluster on this runner: Kafka,
  # Postgres, the API and the consumer all as pods (k8s/). Separate job so
  # build-test stays fast.
  k8s-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner reaches the cluster only through kubectl port-forward (below).
      # 127.0.0.1, not localhost, so nothing tries IPv6 first.
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      K8S_API: http://127.0.0.1:8080
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: fintech

      - name: Build the image and load it into kind
        run: |
          docker build -t fintech-pipeline:ci .
          kind load docker-image fintech-pipeline:ci --name fintech

      - name: Start Kafka and Postgres
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl create configmap db-init --from-file=init.sql=db-init-script.sql
          kubectl apply -f k8s/kafka.yaml -f k8s/postgres.yaml
          kubectl rollout status deployment/kafka --timeout=300s
          kubectl rollout status deployment/postgres --timeout=300s

      - name: Create the topic (3 partitions)
        run: |
          kubectl apply -f k8s/topic-job.yaml
          kubectl wait --for=condition=complete job/create-topics --timeout=300s
          kubectl logs job/create-topics

      - name: Start the API and the consumer
        run: |
          kubectl apply -f k8s/api.yaml -f k8s/consumer.yaml
          kubectl rollout status deployment/api --timeout=300s
          kubectl rollout status deployment/consumer --timeout=300s

      - name: Wait until everything is ready
        run: |
          kubectl wait --for=condition=available deployment --all --timeout=300s
          kubectl wait --for=condition=ready pod -l app=kafka --timeout=300s
          kubectl wait --for=condition=ready pod -l app=postgres --timeout=300s
          kubectl wait --for=condition=ready pod -l app=api --timeout=300s
          kubectl wait --for=condition=ready pod -l app=consumer --timeout=300s
          kubectl wait --for=condition=complete job/create-topics --timeout=60s
          kubectl get pods,svc -o wide

      # Background port-forwards to the Services, each in a loop that restarts
      # it if it drops (kubectl port-forward exits on some connection errors).
      # They keep running for the later steps; the runner ends them with the job.
      - name: Port-forward the API and Postgres to the runner
        run: |
          nohup bash -c 'while true; do kubectl port-forward --address 127.0.0.1 svc/api 8080:8000; echo "api port-forward exited ($?), restarting"; sleep 1; done' > /tmp/pf-api.log 2>&1 &
          nohup bash -c 'while true; do kubectl port-forward --address 127.0.0.1 svc/postgres 5432:5432; echo "postgres port-forward exited ($?), restarting"; sleep 1; done' > /tmp/pf-postgres.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "$K8S_API/health"; then echo; echo "API /health OK"; break; fi
            sleep 2
          done
          curl -fsS "$K8S_API/health" > /dev/null || { echo "API /health not answering through the port-forward"; cat /tmp/pf-api.log; exit 1; }
          python - <<'EOF'
          import os, sys, time
          import psycopg2
          for _ in range(30):
              try:
                  psycopg2.connect(host=os.environ["DB_HOST"], port=os.environ["DB_PORT"], user="fintech",
                                   password="fintech", dbname="transactions_db", connect_timeout=3).close()
                  print("Postgres OK")
                  sys.exit(0)
              except psycopg2.OperationalError as exc:
                  error = exc
                  time.sleep(2)
          sys.exit(f"Postgres not reachable through the port-forward: {error}")
          EOF

      - name: Smoke, backlog and recovery tests
        run: python -m scripts.k8s_smoke --smoke 500 --payments 10000 --replicas 1,3

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,svc,endpoints -o wide || true
          kubectl get events --sort-by=.lastTimestamp | tail -n 40 || true
          # The API and consumer pods always; any other pod only if it is not ready
          # (READY column "x/y" with x < y, ignoring the finished topic Job pod).
          pods="$(kubectl get pods -l 'app in (api,consumer)' -o name | sed 's|pod/||')"
          pods="$pods $(kubectl get pods -l 'app notin (api,consumer)' --no-headers 2>/dev/null | awk '{split($2, r, "/"); if (r[1] != r[2] && $3 != "Completed") print $1}')"
          for pod in $pods; do
            echo "::group::describe + logs: $pod"
            kubectl describe pod "$pod" || true
            kubectl logs "$pod" --all-containers --tail=200 || true
            echo "--- previous container (if it restarted) ---"
            kubectl logs "$pod" --all-containers --previous --tail=200 || true
            echo "::endgroup::"
          done
          echo "::group::port-forward logs"
          cat /tmp/pf-api.log /tmp/pf-postgres.log 2>/dev/null || true
          echo "::endgroup::"
