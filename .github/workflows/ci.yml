name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff==0.17.4
          ruff check .

      - name: Run tests
        env:
          DISABLE_KAFKA_CONSUMER: 1
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t kafka-cicd-app .
