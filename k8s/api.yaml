# The HTTP API: one copy that takes payments on POST /transactions and hands
# them to Kafka (it does not write to Postgres). The Service exposes it on
# NodePort 30080, which the kind config maps to localhost:8080 on the runner.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: fintech-pipeline:ci
          imagePullPolicy: Never  # built and loaded into kind by the k8s-smoke CI job
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: pipeline-config}
          env:
            - name: DISABLE_KAFKA_CONSUMER  # the consumer is its own Deployment
              value: "1"
          resources:
            requests: {cpu: 250m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080  # -> localhost:8080 via k8s/kind-config.yaml
